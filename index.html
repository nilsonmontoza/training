<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Bitácora de entrenamiento personal con seguimiento semanal y historial guardado en el navegador.">
<title>Bitácora de entrenamiento</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #1c1b19;
    --panel: #262421;
    --panel-raised: #302e2a;
    --line: #3c3934;
    --steel: #9aa5ac;
    --chalk: #f2efe6;
    --chalk-dim: #cfc9bb;
    --rust: #c4341f;
    --rust-dim: #7d2417;
    --hivis: #c9d93b;
    --hivis-dim: #7d8721;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 0%, #2a2823 0%, transparent 45%),
      var(--bg);
    color: var(--chalk);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 0 0 60px;
  }

  .display{ font-family:'Oswald', sans-serif; text-transform: uppercase; }

  header{
    padding: 32px 20px 24px;
    border-bottom: 1px solid var(--line);
    background: repeating-linear-gradient(135deg, #201f1c 0px, #201f1c 14px, #221f1c 14px, #221f1c 28px);
    position: relative;
  }
  header::after{
    content:"";
    position:absolute; left:0; right:0; bottom:-1px; height:4px;
    background: linear-gradient(90deg, var(--rust) 0 25%, var(--hivis) 25% 50%, var(--rust) 50% 75%, var(--hivis) 75% 100%);
    opacity:.7;
  }

  .header-inner{
    max-width: 720px; margin: 0 auto;
    display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap;
  }

  h1{
    margin:0; font-size: clamp(28px, 5vw, 40px); letter-spacing: 1px; line-height:1;
  }
  .tagline{ color: var(--steel); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; margin-top:6px; }
  header .routine-tag{ display:inline-block; margin-top:12px; }

  .plates{ display:flex; flex-direction: column; align-items:center; gap:6px; }
  .plates-label{ font-size:11px; color:var(--steel); letter-spacing:.1em; text-transform:uppercase; }
  .plate-row{ display:flex; gap:5px; }
  .plate{
    width:26px; height:44px; border-radius:6px;
    background: var(--panel-raised);
    border: 2px solid var(--line);
    transition: all .25s ease;
  }
  .plate.done{
    background: var(--hivis);
    border-color: var(--hivis-dim);
    box-shadow: 0 0 10px rgba(201,217,59,.35);
  }
  .plate-count{ font-family:'Oswald',sans-serif; font-size: 20px; }

  main{ max-width: 720px; margin: 0 auto; padding: 24px 20px 0; }

  button:focus-visible, input:focus-visible, .check:focus-visible{
    outline: 2px solid var(--hivis); outline-offset: 2px;
  }

  .routine-tag{
    font-size:11px; padding:4px 10px; border-radius:100px;
    border:1px solid var(--rust-dim); color: var(--rust);
    letter-spacing:.08em; text-transform:uppercase; white-space:nowrap;
  }

  /* --- Week status bar --- */
  .week-bar{
    background: var(--panel); border:1px solid var(--line); border-radius:8px;
    padding: 14px 16px 16px; margin-bottom: 22px;
  }
  .week-bar-top{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    flex-wrap:wrap; margin-bottom:12px;
  }
  .week-bar .info{ font-size:12.5px; color: var(--chalk-dim); }
  .week-bar .info b{ color: var(--chalk); }
  .progress-track{
    height:6px; border-radius:100px; background: var(--panel-raised); overflow:hidden;
  }
  .progress-fill{
    height:100%; width:0%; border-radius:100px;
    background: linear-gradient(90deg, var(--hivis-dim), var(--hivis));
    transition: width .35s ease;
  }
  .btn{
    font-family:'Oswald', sans-serif; letter-spacing:.05em; text-transform:uppercase;
    font-size: 13px; padding: 9px 16px; border-radius:6px; border:none; cursor:pointer;
    background: var(--rust); color: var(--chalk);
    transition: background .15s ease;
  }
  .btn:hover{ background:#a92a18; }
  .btn.secondary{
    background: transparent; border:1px solid var(--line); color: var(--steel);
  }
  .btn.secondary:hover{ border-color: var(--steel); color: var(--chalk); }

  /* --- Day cards --- */
  .day{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 12px;
    overflow:hidden;
    transition: border-color .2s ease;
  }
  .day.checked{ border-color: var(--hivis-dim); }

  .day-head{
    display:flex; align-items:center; gap:14px;
    padding: 14px 16px;
    cursor:pointer;
    user-select:none;
    transition: background-color .15s ease;
  }
  .day-head:hover{ background: var(--panel-raised); }

  .check{
    flex-shrink:0;
    width:26px; height:26px; border-radius:6px;
    border: 2px solid var(--steel);
    background: transparent;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition: all .15s ease;
  }
  .check.on{ background: var(--hivis); border-color: var(--hivis); }
  .check:active{ transform: scale(.88); }
  .check svg{ width:15px; height:15px; opacity:0; transition: opacity .1s ease; }
  .check.on svg{ opacity:1; }

  .day-info{ flex:1; min-width:0; }
  .day-name{ font-family:'Oswald', sans-serif; font-size:17px; letter-spacing:.03em; }
  .day-name .rest{ color: var(--steel); font-weight:400; }
  .day-groups{ font-size:12.5px; color: var(--chalk-dim); margin-top:2px; }
  .day-groups b{ color: var(--hivis); font-weight:600; }

  .chevron{ color: var(--steel); transition: transform .2s ease; flex-shrink:0; }
  .day.open .chevron{ transform: rotate(180deg); }

  .day-body{
    max-height:0; overflow:hidden; transition: max-height .25s ease;
    border-top: 1px solid transparent;
  }
  .day.open .day-body,
  .day.rest .day-body{ border-top-color: var(--line); max-height: 600px; }

  .exercise-group{ padding: 14px 16px 4px 56px; }
  .exercise-group:last-child{ padding-bottom: 14px; }
  .exercise-group h4{
    margin:0 0 8px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color: var(--rust);
  }
  .exercise-group ul{ margin:0; padding:0; list-style:none; }
  .exercise-group li{
    font-size: 13.5px; color: var(--chalk-dim); padding: 4px 0 4px 14px; position:relative;
  }
  .exercise-group li::before{
    content:"—"; position:absolute; left:0; color: var(--steel);
  }

  .rest-body{ padding: 14px 16px 18px 56px; font-size:13.5px; color: var(--steel); font-style:italic; }

  /* --- History --- */
  .history{
    margin-top: 30px; border-top: 1px solid var(--line); padding-top: 18px;
  }
  .history h3{
    font-family:'Oswald', sans-serif; font-size:15px; letter-spacing:.08em; text-transform:uppercase;
    color: var(--steel); margin: 0 0 12px;
  }
  .history-row{
    display:flex; align-items:center; justify-content:space-between;
    padding: 10px 14px; background: var(--panel); border:1px solid var(--line); border-radius:6px;
    margin-bottom:8px; font-size:13px;
  }
  .history-row .hr-days{ color: var(--chalk-dim); }
  .history-row .hr-actions{ display:flex; align-items:center; gap:10px; }
  .history-row .hr-score{
    font-family:'Oswald', sans-serif; color: var(--hivis); font-size:15px;
    background: transparent; border:none; cursor:pointer; padding:2px 6px; border-radius:4px;
  }
  .history-row .hr-score:hover{ background: var(--panel-raised); }
  .history-row .hr-delete{
    width:22px; height:22px; border-radius:50%; flex-shrink:0;
    background: transparent; border:1px solid var(--line); color: var(--steel);
    font-size:11px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .history-row .hr-delete:hover{ border-color: var(--rust); color: var(--rust); }
  .history-empty{ font-size:13px; color: var(--steel); font-style: italic; }

  footer{
    max-width:720px; margin: 10px auto 0; padding: 0 20px; color: var(--steel); font-size:12px; text-align:center;
  }
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
    background: var(--hivis); color:#1c1b19; padding:10px 18px; border-radius:6px;
    font-size:13px; font-weight:600; opacity:0; transition: all .25s ease; pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div>
      <h1 class="display">Bitácora de<br>entrenamiento</h1>
      <div class="tagline">Marca, entrena, repite</div>
      <span class="routine-tag" id="routineTag"></span>
    </div>
    <div class="plates">
      <div class="plates-label">Días completados</div>
      <div class="plate-row" id="plateRow"></div>
      <div class="plate-count"><span id="plateCount">0</span>/<span id="plateTotal">7</span></div>
    </div>
  </div>
</header>

<main>
  <div class="week-bar">
    <div class="week-bar-top">
      <div class="info">Semana iniciada el <b id="weekStartLabel">—</b></div>
      <button class="btn" id="closeWeekBtn">Finalizar semana</button>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div id="days"></div>

  <div class="history">
    <h3>Historial de semanas</h3>
    <div id="historyList"></div>
  </div>
</main>

<footer>La semana en curso se guarda en este navegador; el historial se guarda en el servidor. Cada 7 días la semana se cierra sola y se archiva; también puedes cerrarla antes con el botón.</footer>
<div class="toast" id="toast"></div>

<script>
const exerciseBank = {
  "Pecho": ["Press de banca plano", "Press inclinado con mancuerna", "Aperturas con mancuerna", "Fondos en paralelas"],
  "Bíceps": ["Curl con barra", "Curl martillo", "Curl concentrado", "Curl en banco Scott"],
  "Espalda": ["Dominadas (o jalón al pecho)", "Remo con barra", "Remo en polea baja", "Jalón al pecho agarre ancho"],
  "Hombro": ["Press militar", "Elevaciones laterales", "Pájaros (deltoide posterior)", "Press Arnold"],
  "Tríceps": ["Press francés", "Extensión en polea (cuerda)", "Fondos en banco", "Press cerrado"],
  "Cuádriceps": ["Sentadilla", "Prensa de piernas", "Extensión de cuádriceps", "Sentadilla búlgara"],
  "Isquios": ["Peso muerto rumano", "Curl femoral acostado", "Curl femoral sentado", "Buenos días"],
  "Glúteo": ["Hip thrust", "Puente de glúteo", "Patada de glúteo en polea", "Zancadas"],
  "Pantorrilla": ["Elevación de talones de pie", "Elevación de talones sentado", "Elevación de talones en prensa"]
};

const routines = {
  principal: {
    label: "Mi rutina",
    days: [
      { day: "Lunes",     groups: ["Pecho", "Bíceps"] },
      { day: "Martes",    groups: ["Cuádriceps", "Pantorrilla"] },
      { day: "Miércoles", groups: ["Espalda", "Hombro", "Tríceps"] },
      { day: "Jueves",    groups: ["Isquios", "Glúteo", "Pantorrilla"] },
      { day: "Viernes",   groups: ["Pecho", "Bíceps", "Tríceps"] },
      { day: "Sábado",    groups: [] },
      { day: "Domingo",   groups: [] }
    ]
  }
};

const WEEK_MS = 7 * 24 * 60 * 60 * 1000;
const CURRENT_KEY = "rutina:semana-actual";
const HISTORY_API = "/api/historial";

// In-memory mirrors of persisted data
let currentWeek = null;   // { routineKey, checkedDays: {day:true}, openDays:{day:true}, weekStart: isoString }
let history = [];         // [{ id, weekStart, weekEnd, routineKey, routineLabel, completed, total }] cargado desde el servidor
let storageReady = false;

const routineTag = document.getElementById('routineTag');
const daysContainer = document.getElementById('days');
const plateRow = document.getElementById('plateRow');
const plateCount = document.getElementById('plateCount');
const plateTotal = document.getElementById('plateTotal');
const weekStartLabel = document.getElementById('weekStartLabel');
const closeWeekBtn = document.getElementById('closeWeekBtn');
const progressFill = document.getElementById('progressFill');
const historyList = document.getElementById('historyList');
const toastEl = document.getElementById('toast');

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 2200);
}

function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('es-ES', { day:'2-digit', month:'short' });
}

function totalTrainingDays(routineKey){
  return routines[routineKey].days.filter(d => d.groups.length > 0).length;
}

function newWeek(routineKey){
  return {
    routineKey: routineKey || 'principal',
    checkedDays: {},
    openDays: {},
    weekStart: new Date().toISOString()
  };
}

async function loadData(){
  try{
    const raw = localStorage.getItem(CURRENT_KEY);
    currentWeek = raw ? JSON.parse(raw) : newWeek('principal');
  }catch(e){
    currentWeek = newWeek('principal');
  }

  await loadHistory();

  // Auto-close week if 7+ days have passed since it started
  const started = new Date(currentWeek.weekStart).getTime();
  if(Date.now() - started >= WEEK_MS){
    await archiveWeek(true);
  }

  storageReady = true;
  render();
}

async function saveCurrentWeek(){
  try{
    localStorage.setItem(CURRENT_KEY, JSON.stringify(currentWeek));
  }catch(e){ console.error('No se pudo guardar la semana actual', e); }
}

async function loadHistory(){
  try{
    const res = await fetch(HISTORY_API);
    history = res.ok ? await res.json() : [];
  }catch(e){
    console.error('No se pudo cargar el historial desde el servidor', e);
    history = [];
  }
}

async function archiveWeek(silent){
  const routine = routines[currentWeek.routineKey];
  const total = totalTrainingDays(currentWeek.routineKey);
  const completed = routine.days.filter(d => d.groups.length > 0 && currentWeek.checkedDays[d.day]).length;

  try{
    const res = await fetch(HISTORY_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        weekStart: currentWeek.weekStart,
        weekEnd: new Date().toISOString(),
        routineKey: currentWeek.routineKey,
        routineLabel: routine.label,
        completed,
        total
      })
    });
    if(res.ok) history.unshift(await res.json());
  }catch(e){
    console.error('No se pudo guardar la semana en el historial', e);
  }

  currentWeek = newWeek(currentWeek.routineKey);
  await saveCurrentWeek();

  if(!silent) showToast('Semana finalizada y guardada en el historial');
  render();
}

async function editHistoryEntry(id){
  const entry = history.find(h => h.id === id);
  if(!entry) return;
  const input = prompt('Días completados', entry.completed);
  if(input === null) return;
  const completed = Math.max(0, Math.min(entry.total, parseInt(input, 10) || 0));
  try{
    const res = await fetch(`${HISTORY_API}/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ completed })
    });
    if(res.ok){
      const updated = await res.json();
      history = history.map(h => h.id === id ? updated : h);
      render();
      showToast('Entrada actualizada');
    }
  }catch(e){
    console.error('No se pudo actualizar la entrada del historial', e);
  }
}

async function deleteHistoryEntry(id){
  if(!confirm('¿Eliminar esta semana del historial?')) return;
  try{
    const res = await fetch(`${HISTORY_API}/${id}`, { method: 'DELETE' });
    if(res.ok){
      history = history.filter(h => h.id !== id);
      render();
      showToast('Entrada eliminada del historial');
    }
  }catch(e){
    console.error('No se pudo eliminar la entrada del historial', e);
  }
}

closeWeekBtn.addEventListener('click', () => archiveWeek(false));

async function toggleCheck(day){
  currentWeek.checkedDays[day] = !currentWeek.checkedDays[day];
  await saveCurrentWeek();
  render();
}

function toggleOpen(day){
  currentWeek.openDays[day] = !currentWeek.openDays[day];
  render();
}

function render(){
  if(!storageReady) return;
  const routine = routines[currentWeek.routineKey];
  routineTag.textContent = routine.label;
  weekStartLabel.textContent = fmtDate(currentWeek.weekStart);

  const total = totalTrainingDays(currentWeek.routineKey);
  const done = routine.days.filter(d => d.groups.length > 0 && currentWeek.checkedDays[d.day]).length;
  plateCount.textContent = done;
  plateTotal.textContent = total;
  progressFill.style.width = (total ? Math.round((done / total) * 100) : 0) + '%';
  plateRow.innerHTML = "";
  for(let i=0;i<total;i++){
    const p = document.createElement('div');
    p.className = 'plate' + (i < done ? ' done' : '');
    plateRow.appendChild(p);
  }

  daysContainer.innerHTML = "";
  routine.days.forEach(d => {
    const isRest = d.groups.length === 0;
    const isChecked = !!currentWeek.checkedDays[d.day];
    const isOpen = !!currentWeek.openDays[d.day];

    const card = document.createElement('div');
    card.className = 'day' + (isChecked ? ' checked' : '') + (isOpen && !isRest ? ' open' : '');

    const head = document.createElement('div');
    head.className = 'day-head';

    const check = document.createElement('button');
    check.type = 'button';
    check.className = 'check' + (isChecked ? ' on' : '');
    check.setAttribute('aria-pressed', isChecked);
    check.setAttribute('aria-label', `${isChecked ? 'Desmarcar' : 'Marcar'} ${d.day} como completado`);
    check.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#1c1b19" stroke-width="3"><path d="M4 12l5 5L20 6"/></svg>';
    check.onclick = (e) => { e.stopPropagation(); toggleCheck(d.day); };
    check.onkeydown = (e) => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggleCheck(d.day); } };

    const info = document.createElement('div');
    info.className = 'day-info';
    info.innerHTML = `<div class="day-name">${d.day}${isRest ? ' <span class="rest">· Descanso</span>' : ''}</div>` +
      (isRest ? '' : `<div class="day-groups">${d.groups.map(g => `<b>${g}</b>`).join(' + ')}</div>`);

    head.appendChild(check);
    head.appendChild(info);

    if(!isRest){
      const chev = document.createElement('div');
      chev.className = 'chevron';
      chev.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>';
      head.appendChild(chev);
      head.setAttribute('aria-expanded', isOpen);
      head.setAttribute('tabindex', '0');
      head.onclick = () => toggleOpen(d.day);
      head.onkeydown = (e) => {
        if(e.key === 'Enter' || e.key === ' '){
          e.preventDefault();
          toggleOpen(d.day);
        }
      };
    }

    card.appendChild(head);

    const body = document.createElement('div');
    body.className = 'day-body';
    const bodyId = `body-${d.day.toLowerCase().replace(/\s+/g, '-')}`;
    body.id = bodyId;
    if(isOpen && !isRest){
      body.style.maxHeight = '600px';
      d.groups.forEach(g => {
        const eg = document.createElement('div');
        eg.className = 'exercise-group';
        eg.innerHTML = `<h4>${g}</h4><ul>${(exerciseBank[g]||[]).map(ex => `<li>${ex}</li>`).join('')}</ul>`;
        body.appendChild(eg);
      });
    } else if(isRest){
      body.innerHTML = '<div class="rest-body">Recuperación activa: caminata suave o estiramientos.</div>';
    }
    card.appendChild(body);
    daysContainer.appendChild(card);
  });

  // History list
  historyList.innerHTML = "";
  if(history.length === 0){
    historyList.innerHTML = '<div class="history-empty">Aún no hay semanas cerradas.</div>';
  } else {
    history.forEach(h => {
      const row = document.createElement('div');
      row.className = 'history-row';
      row.innerHTML = `
        <div class="hr-days">${fmtDate(h.weekStart)} – ${fmtDate(h.weekEnd)} · ${h.routineLabel}</div>
        <div class="hr-actions">
          <button type="button" class="hr-score" title="Editar días completados">${h.completed}/${h.total}</button>
          <button type="button" class="hr-delete" title="Eliminar" aria-label="Eliminar semana del historial">✕</button>
        </div>
      `;
      row.querySelector('.hr-score').onclick = () => editHistoryEntry(h.id);
      row.querySelector('.hr-delete').onclick = () => deleteHistoryEntry(h.id);
      historyList.appendChild(row);
    });
  }
}

loadData();
</script>
</body>
</html>
